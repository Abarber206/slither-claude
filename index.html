<html lang="en">
<head>

<style>
:root{--bg:#06070a;--cream:#F3EBDD;--coral:#D97757;--muted:#a19787;--card:rgba(16,15,16,.82)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--cream);overscroll-behavior:none}
canvas#c{display:block;position:fixed;inset:0;width:100%;height:100%}
.hidden{display:none!important}
#hud{position:fixed;inset:0;pointer-events:none}
#stats{text-shadow:0 1px 3px rgba(0,0,0,.65);position:absolute;left:calc(14px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top))}
#score{font:700 30px/1 Fraunces,Georgia,serif;letter-spacing:-.02em}
#stats small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px}
#rank{font-size:12px;color:var(--muted);margin-top:2px}
#online{font-size:11px;color:#9DB17C;margin-top:3px}
#pu{display:flex;flex-direction:column;gap:5px;margin-top:8px;align-items:flex-start}
.pill{font-size:11px;font-weight:600;padding:4px 9px;border-radius:99px;background:rgba(10,10,12,.6);border:1px solid currentColor}
#mini{position:absolute;left:calc(12px + env(safe-area-inset-left));top:calc(132px + env(safe-area-inset-top));width:150px;height:150px;border-radius:50%;box-shadow:0 4px 18px rgba(0,0,0,.45)}
@media (max-width:520px){#mini{width:124px;height:124px}}
#lb{position:absolute;right:calc(12px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top));background:rgba(10,10,12,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(243,235,221,.08);border-radius:14px;padding:8px 11px;min-width:150px;font-size:12px}
#lb h4{margin:0 0 5px;font:600 10px system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--coral)}
#lbl{list-style:none;margin:0;padding:0}
#lbl li{display:flex;justify-content:space-between;gap:12px;padding:1.5px 0;color:rgba(243,235,221,.72);white-space:nowrap;font-variant-numeric:tabular-nums}
#lbl li.me{color:var(--coral);font-weight:700}
#lbl li.hum .nm::before{content:"● ";color:#9DB17C}
#lbl li.sep{border-top:1px solid rgba(243,235,221,.1);margin-top:3px;padding-top:4px}
#lbl .nm{overflow:hidden;text-overflow:ellipsis;max-width:104px}
@media (max-width:520px){#lb{min-width:0;font-size:11px;padding:7px 9px}#lbl .nm{max-width:86px}#score{font-size:26px}}
#feed{text-shadow:0 1px 2px rgba(0,0,0,.5);position:absolute;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:6px;width:min(80vw,360px)}
.fd{font-size:13px;padding:6px 12px;border-radius:99px;background:rgba(10,10,12,.7);border:1px solid rgba(243,235,221,.1);transition:opacity .5s,transform .5s;animation:pop .3s ease-out;text-align:center}
.fd b{color:var(--coral)}
.fd.big{font:700 16px Fraunces,Georgia,serif;color:var(--coral);border-color:rgba(217,119,87,.4)}
.fd.out{opacity:0;transform:translateY(-6px)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
#boost{position:absolute;right:calc(22px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));width:92px;height:92px;border-radius:50%;border:2px solid rgba(217,119,87,.7);background:radial-gradient(circle at 40% 35%,rgba(217,119,87,.35),rgba(10,10,12,.55));color:var(--cream);font:700 12px system-ui,sans-serif;letter-spacing:.14em;pointer-events:auto;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .08s}
#boost.on{transform:scale(.92);background:radial-gradient(circle at 40% 35%,rgba(217,119,87,.8),rgba(217,119,87,.3));box-shadow:0 0 30px rgba(217,119,87,.6)}
#mute{position:absolute;right:calc(14px + env(safe-area-inset-right));bottom:calc(132px + env(safe-area-inset-bottom));width:40px;height:40px;border-radius:50%;border:1px solid rgba(243,235,221,.15);background:rgba(10,10,12,.55);color:var(--cream);font-size:16px;pointer-events:auto}
body.mouse #boost{display:none}
body.mouse #mute{bottom:calc(16px + env(safe-area-inset-bottom))}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at center,rgba(6,7,10,.05),rgba(4,4,6,.6))}
.card{width:min(360px,100%);background:var(--card);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(243,235,221,.1);border-radius:24px;padding:26px 22px 22px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.6);animation:pop .35s ease-out}
.logo{font:700 38px/1 Fraunces,Georgia,serif;letter-spacing:-.03em;display:flex;align-items:center;justify-content:center;gap:8px}

.logo svg{animation:spin 14s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

input{width:100%;background:rgba(243,235,221,.06);border:1px solid rgba(243,235,221,.14);border-radius:12px;padding:12px 14px;color:var(--cream);font:16px system-ui,sans-serif;outline:none;text-align:center;-webkit-user-select:text;user-select:text}

.label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}

.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid rgba(243,235,221,.18);margin-top:10px;font-weight:600;font-size:15px;padding:12px}
.hint{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5}
#best{font-size:13px;margin-top:12px;color:var(--cream)}

#live{font-size:12px;color:#9DB17C;margin-top:8px;line-height:1.4}

#tip{font-size:12px;color:rgba(243,235,221,.55);margin-top:8px;min-height:2.6em;font-style:italic}
h2{font:700 28px/1.1 Fraunces,Georgia,serif;margin:0 0 6px;letter-spacing:-.02em}
#overMsg{color:var(--muted);margin:0 0 18px;font-size:14px}

.grid b{display:block;font:700 22px Fraunces,Georgia,serif}
.grid span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
#newbest{color:var(--coral);font-weight:700;font-size:13px;margin:-8px 0 14px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="stats"><div id="score">0</div><small>length</small><div id="rank"></div><div id="online"></div><div id="pu"></div></div>
  <canvas id="mini"></canvas>

  <div id="feed"></div>
  <button id="boost" aria-label="Boost"><svg width="18" height="18" viewBox="-20 -20 40 40"><g stroke="#F3EBDD" stroke-width="5" stroke-linecap="round"><line x1="0" y1="0" x2="16" y2="0"/><line x1="0" y1="0" x2="8" y2="8"/><line x1="0" y1="0" x2="0" y2="16"/><line x1="0" y1="0" x2="-8" y2="8"/><line x1="0" y1="0" x2="-16" y2="0"/><line x1="0" y1="0" x2="-8" y2="-8"/><line x1="0" y1="0" x2="0" y2="-16"/><line x1="0" y1="0" x2="8" y2="-8"/></g></svg>BOOST</button>

</div>

<div id="menu" class="screen">
  <div class="card">
    <div class="logo"><svg width="34" height="34" viewBox="-20 -20 40 40"><g stroke="#D97757" stroke-width="4.4" stroke-linecap="round"><line x1="0" y1="0" x2="17" y2="0"/><line x1="0" y1="0" x2="8" y2="8"/><line x1="0" y1="0" x2="0" y2="17"/><line x1="0" y1="0" x2="-8" y2="8"/><line x1="0" y1="0" x2="-17" y2="0"/><line x1="0" y1="0" x2="-8" y2="-8"/><line x1="0" y1="0" x2="0" y2="-17"/><line x1="0" y1="0" x2="8" y2="-8"/></g></svg><div>slither<span>.claude</span></div></div>
    <div class="tag">Start tiny. End enormous. Out-think everyone.</div>
    <input id="name" maxlength="14" placeholder="Your name" autocomplete="off" spellcheck="false">
    <div class="label">Skin · <span id="skinName"></span></div>
    <div id="skins"></div>
    <div class="label">World</div>
    <div class="seg"><button id="wMeadow">Meadow</button><button id="wWater">Water</button></div>
    <div class="label">Mode</div>
    <div class="seg"><button id="mOnline">● Online</button><button id="mSolo">Solo</button></div>
    <div id="partyBox">
      <div id="pOut"><button id="pCreate" class="btn2">＋ Create party</button>
        <div class="jrow"><input id="pCode" maxlength="6" placeholder="Party code" autocomplete="off" spellcheck="false" autocapitalize="characters"><button id="pJoin" class="btn2">Join</button></div></div>
      <div id="pIn" class="hidden"><div class="pcode">Party<b id="pShow"></b></div><div id="pMembers"></div>
        <div class="jrow"><button id="pCopy" class="btn2">Copy invite</button><button id="pLeave" class="btn2 dim">Leave</button></div></div>
    </div>
    <button id="play" class="btn">Play</button>
    <div id="live">Connecting…</div>
    <div id="who"></div>
    <div id="best"></div>
    <div id="tip"></div>
    <div class="hint" id="hint"></div>
  </div>
</div>

<div id="over" class="screen hidden">
  <div class="card">
    <h2 id="overTitle">Context window closed</h2>
    <p id="overMsg"></p>
    <div id="newbest" class="hidden">✦ New personal best ✦</div>
    <div class="grid">
      <div><b id="oLen">0</b><span>Length</span></div>
      <div><b id="oKills">0</b><span>Devoured</span></div>
      <div><b id="oTime">0:00</b><span>Survived</span></div>
      <div><b id="oRank">-</b><span>Best rank</span></div>
    </div>
    <button id="again" class="btn">Play again</button>
    <button id="tomenu" class="btn ghost">Change name / skin</button>
  </div>
</div>

<script>
(()=>{
'use strict';
const TAU=Math.PI*2, rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.random()*a.length|0];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const angDiff=(a,b)=>((a-b+Math.PI)%TAU+TAU)%TAU-Math.PI;
const fmt=n=>Math.max(0,Math.floor(n)).toLocaleString();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- constants ---------- */
const R=9000, OFF=R+400, PC=128, PG=Math.ceil(2*OFF/PC), BC=72, BG=Math.ceil(2*OFF/BC);
const PMAX=24000, BMAX=60000, MAXSEG=1100, NAT=14000, NBOTS=40, NPU=30;
const SPEED=190, BOOSTSPD=400, MINMASS=12;
const PAL=['#D97757','#E8A55A','#F3EBDD','#9DB17C','#8AB4D8','#B79CD9','#E07A8F','#E6C86E'];
const SKINS=[
 {n:'Claude',  base:'#D97757',pat:'bands',  c2:'#F3EBDD',cyc:8, eye:'#F3C969'},
 {n:'Python',  base:'#A0814E',pat:'diamond',c2:'#3B2A1A',c3:'#E8D8B0',cyc:10,eye:'#E6C86E'},
 {n:'Viper',   base:'#6F8C4C',pat:'zigzag', c2:'#25321A',cyc:7, eye:'#E8A55A'},
 {n:'Coral',   base:'#C8413A',pat:'coral',  c2:'#16110F',c3:'#E6C86E',cyc:12,eye:'#B8A48A'},
 {n:'Midnight',base:'#1C2230',pat:'stripe', c2:'#6FA0E8',cyc:8, eye:'#8AB4D8',gc:'#6FA0E8'},
 {n:'Albino',  base:'#F1E6D3',pat:'saddle', c2:'#E6C86E',cyc:10,eye:'#D04848'},
 {n:'Lilac',   base:'#9C84C9',pat:'saddle', c2:'#4E3B7A',cyc:8, eye:'#F3EBDD'},
 {n:'Ember',   base:'#2A1A14',pat:'bands',  c2:'#E8A55A',cyc:7, eye:'#E8A55A',gc:'#E8A55A'},
 {n:'Sage',    base:'#9DB17C',pat:'stripe', c2:'#EDE4CC',cyc:8, eye:'#3A322D'},
 {n:'Rose',    base:'#E07A8F',pat:'diamond',c2:'#7A2E42',c3:'#F7D0D8',cyc:10,eye:'#F3EBDD'},
];
const NAMES=['Opus','Sonnet','Haiku','Tokenizer','Context Window','Hallucination','Gradient','Backprop','Attention Head','Temperature 2.0','Stop Sequence','System Prompt','Embedding','Overfit','Big O','Null Pointer','Segfault','Recursion','Chain of Thought','Latent Space','Dropout','Softmax','Kernel Panic','Semicolon','Rubber Duck','Merge Conflict','Off By One','Lorem Ipsum','Async Await','Prompt Injection','Fine Tune','Beam Search','Token Budget','Vector DB','Batch Norm','Learning Rate','Epoch','Perplexity','Cache Miss','Race Condition','Heap Overflow','Hotfix','Regex','Deadlock','Tensor','Few Shot','Zero Shot','Stack Trace'];
const PERS=['hunter','grazer','coward','wanderer','grazer','hunter','grazer'];
const PU_DUR={magnet:9,turbo:6,ghost:6};
const PU_COL={magnet:'#E6C86E',turbo:'#D97757',ghost:'#B79CD9'};
const PU_NAME={magnet:'Magnet',turbo:'Turbo',ghost:'Phase'};
const PU_DESC={magnet:'sparks fly to you',turbo:'boost for free',ghost:'slip through snakes'};
const TIPS=['Tip: tap Create party and send friends the code to play together.','Tip: in the Meadow, flattened grass shows where snakes just passed.','Tip: boost in front of a snake\'s head to cut it off.','Tip: coil around a smaller snake to trap it.','Tip: the bigger you get, the wider you turn.','Tip: dead snakes spill their length as glowing sparks.','Tip: Phase lets you pass through bodies for a few seconds.','Tip: Opus starts huge. Stay out of its way… at first.','Tip: boosting costs length, so pick your moments.','Tip: green dots on the leaderboard are real people.'];
const TINTS=[[70,170,200],[120,125,235],[217,119,87],[175,125,225],[95,195,160]];

/* ---------- canvas ---------- */
const cvs=$('c'), ctx=cvs.getContext('2d');
const mini=$('mini'), mctx=mini.getContext('2d');
let W=0,H=0,DPR=1;
const cam={x:0,y:0,z:.8};

/* ---------- water ---------- */
let world=(function(){try{return localStorage.getItem('slc_world')==='water'?'water':'meadow'}catch(e){return 'meadow'}})(),gF=null,gDX=null,gDY=null,gK=null,GBx=null,GBy=null,GVx=null,GVy=null,PX=null,PY=null,PW=null,waterPrimed=false,WL=1.6,WAVEL=.11,wAcc=0,WC=4,gw=0,gh=0,hA=null,hB=null,fO=null,fN=null,wa=null,wb=null,wt1=null,wt2=null,wimg=null,wShX=0,wShY=0,wLX=0,wLY=0;
const wcv=document.createElement('canvas'), wctx=wcv.getContext('2d');
function initWater(){
  WC=(W*H>1.2e6)?5:4; gw=Math.ceil(W/WC)+3; gh=Math.ceil(H/WC)+3; const n=gw*gh;
  wa=new Float32Array(n); wb=new Float32Array(n); wt1=new Float32Array(n); wt2=new Float32Array(n);
  hA=new Float32Array(n); hB=new Float32Array(n); fO=new Float32Array(n); fN=new Float32Array(n);
  gF=new Float32Array(n); gDX=new Float32Array(n); gDY=new Float32Array(n);
  gK=new Float32Array(n); GBx=new Float32Array(n); GBy=new Float32Array(n); GVx=new Float32Array(n); GVy=new Float32Array(n); PX=new Float32Array(n); PY=new Float32Array(n); PW=new Float32Array(n);
  wcv.width=gw; wcv.height=gh; wimg=wctx.createImageData(gw,gh); const d=wimg.data; for(let i=3;i<d.length;i+=4) d[i]=255;
  wLX=cam.x; wLY=cam.y; wShX=wShY=0;
}
function ripple(wx,wy,rad,str,buf){
  const B=buf||wa;
  const z=cam.z, sx=(W/2+(wx-cam.x)*z)/WC+1+wShX, sy=(H/2+(wy-cam.y)*z)/WC+1+wShY;
  const rc=clamp(rad*z/WC,1.2,14); if(sx<-rc||sy<-rc||sx>gw+rc||sy>gh+rc) return;
  const x0=Math.max(1,Math.floor(sx-rc)),x1=Math.min(gw-2,Math.ceil(sx+rc)),y0=Math.max(1,Math.floor(sy-rc)),y1=Math.min(gh-2,Math.ceil(sy+rc)),r2=rc*rc;
  for(let y=y0;y<=y1;y++){const dy=y-sy;for(let x=x0;x<=x1;x++){const dx=x-sx,d2=dx*dx+dy*dy;if(d2<r2)B[y*gw+x]+=str*(1-d2/r2);}}
}
function shiftBuf(src,dst,ix,iy){
  dst.fill(0); if(Math.abs(ix)>=gw||Math.abs(iy)>=gh) return;
  const x0=Math.max(0,-ix),x1=Math.min(gw,gw-ix);
  for(let y=0;y<gh;y++){const sy=y+iy; if(sy<0||sy>=gh) continue; const so=sy*gw+ix,dof=y*gw; for(let x=x0;x<x1;x++) dst[dof+x]=src[so+x];}
}
function waterTrack(){
  const z=cam.z; wShX+=(cam.x-wLX)*z/WC; wShY+=(cam.y-wLY)*z/WC; wLX=cam.x; wLY=cam.y;
  const ix=Math.trunc(wShX), iy=Math.trunc(wShY);
  if(ix||iy){wShX-=ix;wShY-=iy;
    for(const A of (world==='water'?[wa,wb,hA,hB,fO]:[gF,gK,GBx,GBy,GVx,GVy])){shiftBuf(A,wt1,ix,iy);A.set(wt1);}
    // what scrolled in has no history yet: treat it as already displaced so it doesn't splash
  }
}
function waterStep(){
  if(!waterPrimed){waterPrimed=true;fO.set(fN);fN.fill(0);return;}
  // ---- waves: driven only by CHANGE in body displacement
  const WK=3.4, damp=.977, vis=.2;
  for(let y=1;y<gh-1;y++){let i=y*gw+1;for(let x=1;x<gw-1;x++,i++){
    const n4=hA[i-1]+hA[i+1]+hA[i-gw]+hA[i+gw];
    const v=n4*.5-hB[i]+(fN[i]-fO[i])*WK;
    hB[i]=(v*(1-vis)+(n4*.25)*vis)*damp;}}
  let t0=hA;hA=hB;hB=t0; t0=fO;fO=fN;fN=t0; fN.fill(0);

function LocalNet(){

      for(const [p,o] of st.others) a.push({peer:p,by:null,isMe:false,sameTab:false,kind:'viewer',guest:false,presence:o.presence,updatedAt:o.t});return a;};

      peers:()=>snap(), connected:()=>true, onConnection(fn){setTimeout(()=>fn(true),0);return ()=>{};},
      emit:()=>Promise.resolve(), on:()=>()=>{},

    if(m.t==='hello'){send({t:'p',r:m.r,peer:me,pr:st.mine});return;}
    if(m.t==='bye'){const o=st.others.get(m.peer);if(o){st.others.delete(m.peer);st.change([],[],[{peer:m.peer,presence:o.presence,isMe:false,sameTab:false,kind:'viewer'}]);}return;}
    if(m.t==='p'){const had=st.others.has(m.peer);let pr={};try{pr=Object.freeze(JSON.parse(JSON.stringify(m.pr||{})))}catch(_){}

}

  if(typeof BroadcastChannel!=='undefined'){try{room=LocalNet();transport='local';bindChannel();return;}catch(e){}}

}

let lastNet=0,lastNetKey='';
function netSend(force){

    if(!force&&now-lastNet<70) return;

  ctx.globalAlpha=baseA*.6; const ss=r*2.8,sox=r*.25-ss/2,soy=r*.38-ss/2;
  for(let i=n-1;i>=0;i-=3){const x=WX[i],y=WY[i];if(x<vx0-m||x>vx1+m||y<vy0-m||y>vy1+m)continue;ctx.drawImage(SHADOW,x+sox,y+soy,ss,ss);}
  if(s.boosting||s.pu.turbo>0){
    ctx.globalCompositeOperation='lighter'; const gl=glow(sk.gc||sk.base),gs=r*3.8*(.9+.12*Math.sin(clock*22));
    ctx.globalAlpha=baseA*.45;
    for(let i=n-1;i>=0;i-=2){const x=WX[i],y=WY[i];if(x<vx0-m||x>vx1+m||y<vy0-m||y>vy1+m)continue;ctx.drawImage(gl,x-gs/2,y-gs/2,gs,gs);}
    ctx.globalCompositeOperation='source-over';
  }
  ctx.globalAlpha=baseA;
  const tailLen=Math.max(6,Math.floor(n*.3));
  for(let i=n-1;i>=1;i--){
    const x=WX[i],y=WY[i]; if(x<vx0-m||x>vx1+m||y<vy0-m||y>vy1+m) continue;
    const j=i<n-1?i+1:i,dx=WX[i-1]-WX[j],dy=WY[i-1]-WY[j],d=Math.sqrt(dx*dx+dy*dy)||1,c=dx/d,sn=dy/d;
    const t=n-1-i, rr=t<tailLen?r*(.22+.78*Math.pow(t/tailLen,.6)):r;
    ctx.setTransform(K*c,K*sn,-K*sn,K*c,K*x+OX,K*y+OY);
    ctx.drawImage(spr[i%KC],-rr,-rr,rr*2,rr*2);
  }
  const hx=WX[0],hy=WY[0];
  if(hx>vx0-m&&hx<vx1+m&&hy>vy0-m&&hy<vy1+m){
    const k2=Math.min(2,n-1); let tx=hx-WX[k2],ty=hy-WY[k2],tl=Math.hypot(tx,ty);
    let c,sn; if(tl>1e-3){c=tx/tl;sn=ty/tl;const ca=Math.cos(s.ang),sa=Math.sin(s.ang);c=c*.65+ca*.35;sn=sn*.65+sa*.35;const l2=Math.hypot(c,sn)||1;c/=l2;sn/=l2;}else{c=Math.cos(s.ang);sn=Math.sin(s.ang);}
    s.hang=Math.atan2(sn,c); s.hx=hx; s.hy=hy;
    ctx.setTransform(K*c,K*sn,-K*sn,K*c,K*hx+OX,K*hy+OY); drawHead(s,r*.97);
  }
  ctx.setTransform(K,0,0,K,OX,OY); ctx.globalAlpha=1;
}
function render(){
  const z=cam.z; let sx=0,sy=0; if(shake>0){sx=rnd(-shake,shake);sy=rnd(-shake,shake);}
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='low';
  if(world==='water') ctx.drawImage(wcv,0,0,gw,gh,(-1-wShX)*WC+sx,(-1-wShY)*WC+sy,gw*WC,gh*WC);
  K=DPR*z; OX=DPR*(W/2-cam.x*z+sx); OY=DPR*(H/2-cam.y*z+sy);
  ctx.setTransform(K,0,0,K,OX,OY);
  vx0=cam.x-W/2/z-30; vx1=cam.x+W/2/z+30; vy0=cam.y-H/2/z-30; vy1=cam.y+H/2/z+30;
  if(world==='meadow') drawMeadow();
  // outside the arena
  ctx.beginPath(); ctx.rect(vx0-50,vy0-50,vx1-vx0+100,vy1-vy0+100); ctx.arc(0,0,R,0,TAU,true);
  ctx.fillStyle='rgba(0,0,0,.72)'; ctx.fill();
  let edge=.28+.08*Math.sin(clock*2);
  if(player&&!player.dead&&state==='play'){const d=R-Math.hypot(player.x,player.y);if(d<450)edge+=(1-d/450)*.5*(.6+.4*Math.sin(clock*10));}
  ctx.beginPath();ctx.arc(0,0,R,0,TAU);ctx.lineWidth=30;ctx.strokeStyle=`rgba(217,119,87,${edge})`;ctx.stroke();
  ctx.lineWidth=4;ctx.strokeStyle='rgba(240,150,120,.9)';ctx.stroke();
  // pellets
  ctx.globalCompositeOperation='lighter';
  for(const p of pellets){
    if(p.x<vx0||p.x>vx1||p.y<vy0||p.y>vy1) continue;
    const s=p.r*6*(1+.16*Math.sin(clock*3+p.ph)); ctx.globalAlpha=(!p.nat&&p.life<3)?p.life/3:1;
    ctx.drawImage(glow(p.col),p.x-s/2,p.y-s/2,s,s);
  }
  ctx.globalAlpha=1;
  for(const u of pus){ if(u.x<vx0-60||u.x>vx1+60||u.y<vy0-60||u.y>vy1+60) continue; const s=90*(1+.12*Math.sin(clock*4+u.ph)); ctx.drawImage(glow(PU_COL[u.type]),u.x-s/2,u.y-s/2,s,s); }
  ctx.globalCompositeOperation='source-over';
  for(const u of pus){ if(u.x<vx0-60||u.x>vx1+60||u.y<vy0-60||u.y>vy1+60) continue;
    ctx.save();ctx.translate(u.x,u.y);ctx.rotate(clock*.8+u.ph);ctx.setLineDash([6,5]);ctx.lineWidth=2;ctx.strokeStyle=PU_COL[u.type];ctx.beginPath();ctx.arc(0,0,20,0,TAU);ctx.stroke();ctx.restore();
    drawPUIcon(u,22);
  }
  // snakes: smaller first so giants pass over
  const order=snakes.filter(s=>!s.dead&&s!==player).sort((a,b)=>a.r-b.r);
  for(const s of order) drawSnake(s);
  if(player&&!player.dead) drawSnake(player);
  // labels
  ctx.setTransform(K,0,0,K,OX,OY);
  ctx.font=`600 ${12/z}px system-ui,sans-serif`; ctx.textAlign='center'; ctx.textBaseline='bottom';
  for(const s of snakes){ if(s.dead||s===player) continue; if(s.x<vx0||s.x>vx1||s.y<vy0||s.y>vy1) continue;
    ctx.fillStyle=s.remote?'rgba(190,220,160,.95)':'rgba(243,235,221,.6)'; ctx.fillText(s.remote?'● '+s.name:s.name,s.x,s.y-s.r*1.3-8/z); }
  if(leader&&!leader.dead&&leader.x>vx0&&leader.x<vx1&&leader.y>vy0&&leader.y<vy1){
    const off=leader===player?leader.r*1.3+16/z:leader.r*1.3+30/z; drawSparkle(leader.x,leader.y-off,9/z,'#D97757',clock*1.5,3/z);
  }
  ctx.globalCompositeOperation='lighter';
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life/p.max);const s=p.size;ctx.drawImage(glow(p.col),p.x-s/2,p.y-s/2,s,s);}
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(state==='play'&&joy.active){
    ctx.fillStyle='rgba(243,235,221,.07)';ctx.strokeStyle='rgba(243,235,221,.22)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(joy.bx,joy.by,58,0,TAU);ctx.fill();ctx.stroke();
    ctx.fillStyle='rgba(217,119,87,.65)';ctx.beginPath();ctx.arc(joy.kx,joy.ky,24,0,TAU);ctx.fill();
  }
}

/* ---------- HUD ---------- */
const scoreEl=$('score'),rankEl=$('rank'),lbl=$('lbl'),puEl=$('pu'),onlineEl=$('online');
function updateHud(){
  const alive=snakes.filter(s=>!s.dead).sort((a,b)=>b.mass-a.mass);
  leader=alive[0]||null;
  targetBots=Math.max(18,NBOTS-humansPlaying()*4);
  if(state!=='play'||!player||player.dead) return;
  const LBN=W<520?6:8, rank=alive.indexOf(player)+1; if(rank>0) stats.bestRank=Math.min(stats.bestRank,rank);
  scoreEl.textContent=fmt(player.mass); rankEl.textContent=`Rank ${rank} of ${alive.length}`;
  const h=humansPlaying(); onlineEl.textContent=chan?(h?`● ${h+1} humans${partyCode?' · party '+partyCode:''}`:`● online${partyCode?' · party '+partyCode:''} · waiting for players`):'';
  let html=''; alive.slice(0,LBN).forEach((s,i)=>{html+=`<li class="${s===player?'me':''}${s.remote?' hum':''}"><span class="nm">${i+1}. ${esc(s.name)}</span><span>${fmt(s.mass)}</span></li>`;});
  if(rank>LBN) html+=`<li class="me sep"><span class="nm">${rank}. ${esc(player.name)}</span><span>${fmt(player.mass)}</span></li>`;
  lbl.innerHTML=html;
  let ph=''; for(const k in player.pu) if(player.pu[k]>0) ph+=`<div class="pill" style="color:${PU_COL[k]}">${PU_NAME[k]} ${Math.ceil(player.pu[k])}s</div>`;
  puEl.innerHTML=ph;
}
function drawMini(){
  if(state!=='play') return;
  const sz=mini.width,c=sz/2,rad=c-1.5*DPR,k=rad/R;
  mctx.setTransform(1,0,0,1,0,0); mctx.clearRect(0,0,sz,sz);
  mctx.save(); mctx.beginPath(); mctx.arc(c,c,rad,0,TAU); mctx.clip();
  mctx.fillStyle='rgba(8,10,9,.78)'; mctx.fillRect(0,0,sz,sz);
  // every orb, to scale (bigger orbs brighter)
  const d1=Math.max(.8,.6*DPR), d2=Math.max(1.4,1.3*DPR);
  mctx.fillStyle='rgba(255,255,255,.2)'; mctx.beginPath();
  for(const p of pellets){ if(p.dead||p.v>=5) continue; mctx.rect(c+p.x*k-d1/2,c+p.y*k-d1/2,d1,d1); } mctx.fill();
  mctx.fillStyle='rgba(255,255,255,.95)'; mctx.beginPath();
  for(const p of pellets){ if(p.dead||p.v<5) continue; mctx.rect(c+p.x*k-d2/2,c+p.y*k-d2/2,d2,d2); } mctx.fill();
  // every snake as its real body shape and thickness
  mctx.lineCap='round'; mctx.lineJoin='round';
  const line=(sn,col)=>{const n=sn.n; if(n<2) return; const st=Math.max(1,Math.floor(n/70));
    mctx.strokeStyle=col; mctx.lineWidth=Math.max(1.1*DPR,(sn.rs||sn.r)*2*k);
    mctx.beginPath(); mctx.moveTo(c+sn.bx[0]*k,c+sn.by[0]*k);
    for(let i=st;i<n;i+=st) mctx.lineTo(c+sn.bx[i]*k,c+sn.by[i]*k);
    mctx.lineTo(c+sn.bx[n-1]*k,c+sn.by[n-1]*k); mctx.stroke();};
  for(const sn of snakes){ if(sn.dead||sn===player) continue; line(sn,'rgba(226,72,58,.92)'); }
  if(player&&!player.dead){
    line(player,'#F3EBDD');
    mctx.fillStyle='#ffffff'; mctx.beginPath(); mctx.arc(c+player.x*k,c+player.y*k,Math.max(2*DPR,(player.rs||player.r)*1.4*k),0,TAU); mctx.fill();
    mctx.strokeStyle='rgba(243,235,221,.45)'; mctx.lineWidth=1*DPR; const hw=W/2/cam.z*k,hh=H/2/cam.z*k;
    mctx.strokeRect(c+player.x*k-hw,c+player.y*k-hh,hw*2,hh*2);
  }
  mctx.restore();
  mctx.strokeStyle='rgba(217,119,87,.75)'; mctx.lineWidth=1.5*DPR; mctx.beginPath(); mctx.arc(c,c,rad,0,TAU); mctx.stroke();
}

/* ---------- screens ---------- */
const menuEl=$('menu'),overEl=$('over'),hudEl=$('hud'),nameEl=$('name');
let skinIdx=clamp(parseInt(store.get('slc_skin','0'))||0,0,SKINS.length-1);
nameEl.value=store.get('slc_name','');
nameEl.addEventListener('change',()=>{lastNetKey='';netSend(true);});
const skinsEl=$('skins');
function showSkinName(){$('skinName').textContent=SKINS[skinIdx].n;}
SKINS.forEach((sk,i)=>{
  const b=document.createElement('button');b.className='sk'+(i===skinIdx?' on':'');b.title=sk.n;b.setAttribute('aria-label',sk.n+' skin');
  b.style.background=sk.pat==='coral'?`linear-gradient(135deg,${sk.base} 0 40%,${sk.c2} 40% 55%,${sk.c3} 55% 65%,${sk.c2} 65% 80%,${sk.base} 80%)`:
    `radial-gradient(ellipse 30% 60% at 50% 50%,${sk.c2} 0 98%,transparent 100%),${sk.base}`;
  b.addEventListener('click',()=>{skinIdx=i;[...skinsEl.children].forEach((e,j)=>e.classList.toggle('on',j===i));showSkinName();tone(660,.08,'sine',.05);});
  skinsEl.appendChild(b);
});
showSkinName();
function setHash(){try{const h=netMode==='online'&&partyCode?'#party-'+partyCode:'';if((location.hash||'')!==h){if(h)location.hash=h;else history.replaceState(null,'',location.pathname+location.search);}}catch(e){}}
function applyNet(){store.set('slc_mode',netMode);store.set('slc_party',partyCode);setHash();bindChannel();updateParty();}
$('mOnline').addEventListener('click',()=>{netMode='online';applyNet();});
$('mSolo').addEventListener('click',()=>{netMode='solo';applyNet();});
const pCodeEl=$('pCode');
function joinParty(){const v=cleanParty(pCodeEl.value);if(v.length<3){partyMsg='Enter the 5-letter party code';updateParty();setTimeout(()=>{partyMsg='';updateParty();},2500);return;}pCodeEl.value='';partyCode=v;partyMsg='';netMode='online';applyNet();tone(660,.1,'sine',.06);}
$('pCreate').addEventListener('click',()=>{partyCode=newCode();partyMsg='';netMode='online';applyNet();tone(523,.1,'sine',.06);tone(784,.14,'sine',.06,0,.08);});
$('pJoin').addEventListener('click',joinParty);
$('pLeave').addEventListener('click',()=>{partyCode='';partyMsg='';applyNet();});
$('pCopy').addEventListener('click',()=>{
  const link=transport==='peer'?` ${location.origin}${location.pathname}#party-${partyCode}`:'';
  const text=`Join my slither.claude party! Code: ${partyCode}${link}`;
  const done=ok=>{partyMsg=ok?'Invite copied · paste it to your friends':`Tell friends the code: ${partyCode}`;updateParty();setTimeout(()=>{partyMsg='';updateParty();},3500);};
  try{navigator.clipboard.writeText(text).then(()=>done(true),()=>done(false));}catch(e){done(false);}
});
function setWorld(w){world=w; if(w==='water'&&wimg){const d=wimg.data;for(let i=3;i<d.length;i+=4)d[i]=255;}store.set('slc_world',w);$('wMeadow').classList.toggle('on',w==='meadow');$('wWater').classList.toggle('on',w==='water');
  if(wa){wa.fill(0);wb.fill(0);hA.fill(0);hB.fill(0);fO.fill(0);fN.fill(0);gF.fill(0);gK.fill(0);GBx.fill(0);GBy.fill(0);GVx.fill(0);GVy.fill(0);PW.fill(0);} waterPrimed=false;}
$('wMeadow').addEventListener('click',()=>setWorld('meadow')); $('wWater').addEventListener('click',()=>setWorld('water'));
setWorld(world);
function refreshMenu(){
  $('best').innerHTML=`Best length: <b>${fmt(+store.get('slc_best','0'))}</b>`;
  $('tip').textContent=pick(TIPS);
  $('hint').textContent=inputMode==='touch'?'Touch anywhere to drop a joystick and steer · hold BOOST to speed up':'Mouse to steer · click, hold Space or W to boost · A/D also steer · M mutes';
  updateLive();
}
refreshMenu();
function startGame(){
  initAudio();
  const name=(nameEl.value.trim()||'You').slice(0,14);
  store.set('slc_name',nameEl.value.trim()); store.set('slc_skin',String(skinIdx));
  const s=newSnake({name,skin:SKINS[skinIdx],mass:20,player:true});
  const idx=player?snakes.indexOf(player):-1;
  if(idx>=0) snakes[idx]=s; else snakes.push(s);
  player=s; cam.x=s.x; cam.y=s.y; wLX=cam.x; wLY=cam.y; wa.fill(0); wb.fill(0); hA.fill(0); hB.fill(0); fO.fill(0); fN.fill(0); gF.fill(0); gK.fill(0); GBx.fill(0); GBy.fill(0); GVx.fill(0); GVy.fill(0); waterPrimed=false;
  Object.assign(stats,{kills:0,start:clock,bestRank:99,killer:null,killerPeer:null,streak:0,lastKill:-99,finalMass:0});
  state='play'; menuEl.classList.add('hidden'); overEl.classList.add('hidden'); hudEl.classList.remove('hidden');
  feedEl.innerHTML=''; hudT=0; netSend(true);
  tone(392,.12,'triangle',.07); tone(587.33,.18,'triangle',.07,0,.08);
}
function showOver(){
  state='over'; hudEl.classList.add('hidden');
  const len=stats.finalMass, best=+store.get('slc_best','0'), isBest=len>best;
  if(isBest) store.set('slc_best',String(Math.floor(len)));
  $('overTitle').textContent=pick(['Context window closed','Conversation ended','Token limit reached','Stop sequence hit']);
  $('overMsg').innerHTML=stats.killer?pick([`Out-reasoned by <b>${esc(stats.killer)}</b>.`,`<b>${esc(stats.killer)}</b> saw that coming.`,`Interrupted by <b>${esc(stats.killer)}</b>.`]):'You drifted past the edge of the context window.';
  $('newbest').classList.toggle('hidden',!isBest);
  $('oLen').textContent=fmt(len); $('oKills').textContent=stats.kills;
  const t=Math.floor(stats.diedAt-stats.start); $('oTime').textContent=`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;
  $('oRank').textContent=stats.bestRank<99?'#'+stats.bestRank:'-';
  overEl.classList.remove('hidden');
}
$('play').addEventListener('click',startGame);
$('again').addEventListener('click',startGame);
$('tomenu').addEventListener('click',()=>{state='menu';overEl.classList.add('hidden');menuEl.classList.remove('hidden');refreshMenu();netSend(true);});

/* ---------- boot ---------- */
resize();
for(let i=0;i<NAT;i++) natPellet();
for(let i=0;i<NBOTS;i++) snakes.push(newBot(true));
for(let i=0;i<NPU;i++) spawnPU();
updateHud(); if(leader){cam.x=leader.x;cam.y=leader.y;wLX=cam.x;wLY=cam.y;}
let last=performance.now(),hudT=0,miniT=0;
function frame(t){
  let dt=(t-last)/1000; last=t; if(!(dt>0)) dt=0; if(dt>.1) dt=.1;
  const steps=dt>1/40?2:1,h=dt/steps;
  for(let i=0;i<steps;i++){clock+=h; if(state==='play') playerInput(); step(h);}
  updateCam(dt);
  waterTrack(); wAcc=Math.min(wAcc+dt,.034);
  if(world==='water'){while(wAcc>=1/60){wAcc-=1/60; waterSources(); waterStep();} waterRender();}
  else{while(wAcc>=1/60){wAcc-=1/60; grassSources(); grassStep();}}
  hudT-=dt; if(hudT<=0){hudT=.2;updateHud();if(state==='menu')updateParty();}
  miniT-=dt; if(miniT<=0){miniT=.1;drawMini();}
  if(state==='dying'&&clock-stats.diedAt>1.5) showOver();
  shake*=Math.exp(-dt*9); if(shake<.2) shake=0;
  boostAudio(); netSend(false); render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
connectNet();
document.addEventListener('visibilitychange',()=>{if(document.hidden&&noiseGain&&AC){noiseGain.gain.value=0;boostSnd=false;}});
})();
</script>
